<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Encuesta AgroTec | Tu ruta de aprendizaje</title>
  <meta name="description" content="Responde 7 preguntas rápidas y descubre los cursos y herramientas de AgroTec América pensados para ti.">
  <meta name="theme-color" content="#fbfaf5">
  <link rel="canonical" href="https://agrotecamerican.com/encuesta/">
  <link rel="icon" href="../img/logo.jpg">
  <link rel="preload" href="../fonts/bricolage-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../fonts/hanken-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#stage">Ir al contenido</a>

  <div class="app" id="app">
    <header class="topbar">
      <a class="topbar__brand" href="../" aria-label="Volver a AgroTec América">
        <img src="../img/brand/logo-horizontal.png" alt="AgroTec América" width="304" height="84">
      </a>
      <div class="topbar__progress" id="progress" aria-hidden="true"></div>
      <a class="topbar__later" id="later" href="../">Responder después</a>
    </header>

    <main class="stage" id="stage" aria-live="polite">
      <!-- Pantalla de bienvenida estática (la sustituye app.js al cargar) -->
      <section class="screen screen--intro">
        <p class="eyebrow">Te damos la bienvenida</p>
        <h1 class="title">Armemos tu ruta <span class="title__accent">a tu medida.</span></h1>
        <p class="lead">Responde 7 preguntas rápidas y te recomendaremos los cursos, materiales y herramientas que más te sirven. Solo se hace una vez.</p>
      </section>
    </main>

    <footer class="actionbar" id="actionbar"></footer>
  </div>

  <script src="encuesta-defaults.js"></script>
  <script src="firebase-shared.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
