<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de encuesta | AgroTec América</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fbfaf5">
  <link rel="icon" href="../../img/logo.jpg">
  <link rel="preload" href="../../fonts/bricolage-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../../fonts/hanken-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <!-- Acceso -->
  <section class="gate" id="gate">
    <div class="gate__card">
      <img class="gate__logo" src="../../img/brand/logo-horizontal.png" alt="AgroTec América" width="304" height="84">
      <p class="eyebrow">Panel administrativo</p>
      <h1 class="gate__title">Encuesta de aprendizaje</h1>
      <p class="gate__text" id="gate-text">Inicia sesión con tu cuenta de Google autorizada para ver las respuestas y editar la encuesta.</p>
      <button class="btn btn--google" type="button" id="btn-login">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M21.6 12.2c0-.7-.1-1.3-.2-1.9H12v3.7h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z" fill="#4285f4"/><path d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z" fill="#34a853"/><path d="M6.4 13.9a6 6 0 0 1 0-3.8V7.5H3.1a10 10 0 0 0 0 9z" fill="#fbbc04"/><path d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.5l3.3 2.6C7.2 7.8 9.4 6 12 6z" fill="#ea4335"/></svg>
        Entrar con Google
      </button>
      <button class="btn btn--ghost" type="button" id="btn-logout-gate" hidden>Cerrar sesión</button>
      <p class="gate__note" id="gate-note"></p>
    </div>
  </section>

  <!-- Panel -->
  <div class="panel" id="panel" hidden>
    <header class="topbar">
      <a class="topbar__brand" href="../../" aria-label="Ir al sitio de AgroTec América">
        <img src="../../img/brand/logo-horizontal.png" alt="AgroTec América" width="304" height="84">
      </a>
      <div class="topbar__title">
        <strong>Panel de encuesta</strong>
        <span id="topbar-status">Cargando…</span>
      </div>
      <div class="topbar__actions">
        <a class="btn btn--ghost btn--sm" href="../" target="_blank" rel="noopener">Ver encuesta ↗</a>
        <div class="user" id="user-chip"></div>
        <button class="btn btn--ghost btn--sm" type="button" id="btn-logout">Salir</button>
      </div>
    </header>

    <nav class="tabs" aria-label="Secciones del panel">
      <button class="tab is-active" type="button" data-tab="resumen">Resumen</button>
      <button class="tab" type="button" data-tab="preguntas">Preguntas</button>
      <button class="tab" type="button" data-tab="cursos">Cursos</button>
      <button class="tab" type="button" data-tab="respuestas">Respuestas</button>
      <button class="tab" type="button" data-tab="textos">Textos</button>
    </nav>

    <main class="content">
      <section class="view" id="view-resumen" data-view="resumen"></section>
      <section class="view" id="view-preguntas" data-view="preguntas" hidden></section>
      <section class="view" id="view-cursos" data-view="cursos" hidden></section>
      <section class="view" id="view-respuestas" data-view="respuestas" hidden></section>
      <section class="view" id="view-textos" data-view="textos" hidden></section>
    </main>

    <div class="savebar" id="savebar" hidden>
      <span class="savebar__text">Tienes cambios sin guardar</span>
      <div class="savebar__actions">
        <button class="btn btn--ghost btn--sm" type="button" id="btn-discard">Descartar</button>
        <button class="btn btn--sm" type="button" id="btn-save">Guardar cambios</button>
      </div>
    </div>
  </div>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="../encuesta-defaults.js"></script>
  <script src="../firebase-shared.js"></script>
  <script src="admin.js" defer></script>
</body>
</html>
